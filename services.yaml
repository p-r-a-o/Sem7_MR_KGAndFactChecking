# One entry per process. The UI registry is built from every `kind: module` entry.
# Only simple "key: value" lines (no inline comments) - parsed by common/services.py.
services:
  claim_parser:
    kind: service
    port: 8100
    env: services/claim_parser/requirements.txt
    start: python services/claim_parser/api.py
  powerlink:
    kind: module
    display_name: PowerLink
    port: 8101
    env: modules/powerlink/environment.yml
    start: conda run --no-capture-output -n kgx-powerlink python modules/powerlink/api.py
  anyburl_safran:
    kind: module
    display_name: AnyBURL+SAFRAN
    port: 8102
    env: modules/anyburl_safran/environment.yml
    start: python modules/anyburl_safran/api.py
  expath:
    kind: module
    display_name: eXpath
    port: 8103
    env: modules/expath/requirements.txt
    start: python modules/expath/api.py --show-known
  pyclause:
    kind: module
    display_name: PyClause
    port: 8104
    env: modules/pyclause/environment.yml
    start: conda run --no-capture-output -n kgx-pyclause python modules/pyclause/api.py
  # Other teammates add their modules here.
